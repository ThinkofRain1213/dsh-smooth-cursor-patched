name: Validate

# Build gate for every branch and pull request: the caret measurement tests,
# types, bundling, the loader-id contract, and whether the committed `lib/`
# still matches `src/`. It cannot tell whether the caret renders correctly in a
# browser — that is still verified by hand.
#
# Two deliberate trigger choices:
#
#   * Tag pushes are excluded. `publish.yml` already re-runs this same gate on
#     the release tag before publishing, so validating tags here only doubled
#     the matrix for one commit.
#   * macOS runs on a schedule or on demand instead of on every push. GitHub's
#     macOS pool for this repository has been scarce enough that push-triggered
#     macOS jobs sat in the queue past the 15-minute limit and were cancelled
#     before any runner was assigned (2026-11-17, two runs, both attempts, zero
#     steps executed). Gating macOS out of push runs keeps a red push signal
#     meaning "the code is broken" instead of "the pool was busy".
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Nightly macOS verification. 18:17 UTC keeps it off the top of the hour.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # tsdown 0.22 requires ^22.18.0 || >=24.11.0, so neither older Node 22
        # nor Node 23 is usable here.
        os: [ubuntu-latest, windows-latest]
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/validate
        with:
          node: ${{ matrix.node }}

  macos:
    name: Node ${{ matrix.node }} · macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # One macOS entry is enough to prove the build works on that platform;
        # running two doubles the demand on the scarcest pool for no extra
        # signal. Ubuntu and Windows still cover both Node versions.
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/validate
        with:
          node: ${{ matrix.node }}
